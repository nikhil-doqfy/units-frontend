<app-auth-title title="Sign Up" description="to create your account" />

<app-auth-form>
  <form class="mb-4" [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    <div class="grid-2">
      <ng-container *ngIf="selectedRole === 'owner'">
        <!-- Company Name -->
        <div class="mb-2">
          <label for="companyName" class="form-label">Frist Name</label>
          <input class="form-control" type="text" placeholder="Enter here" />
        </div>

        <!-- Company Emirates ID -->
        <div class="mb-2">
          <label for="emiratesId" class="form-label">Last Name</label>
          <input class="form-control" type="text" placeholder="Enter here" />
        </div>
      </ng-container>
      <ng-container *ngIf="selectedRole === 'property-manager'">
        <div class="mb-2">
          <label for="companyName" class="form-label">Company Name</label>
          <input class="form-control" type="text" placeholder="Enter here" />
          <!-- <small
        *ngIf="
          signupForm.get('companyName')?.invalid &&
          signupForm.get('companyName')?.touched
        "
      >
        Company name is required
      </small> -->
        </div>

        <!-- Company Emirates ID -->
        <div class="mb-2">
          <label for="emiratesId" class="form-label">Company Emirates ID</label>
          <input class="form-control" type="text" placeholder="Enter here" />
          <small
            *ngIf="
              signupForm.get('emiratesId')?.invalid &&
              signupForm.get('emiratesId')?.touched
            "
          >
            Emirates ID is required
          </small>
        </div>
      </ng-container>
      <ng-container *ngIf="selectedRole === 'tenant'">
        <div class="mb-2">
          <label for="buildingName" class="form-label">Full Name</label>
          <input class="form-control" type="text" placeholder="Enter here" />
        </div>

        <div class="mb-2">
          <label for="flatNumber" class="form-label">Emirates ID</label>
          <input class="form-control" type="text" placeholder=" Enter here" />
        </div>
      </ng-container>
      <!-- Email Address -->
      <div class="mb-2">
        <label for="email" class="form-label justify-content-between"
          >Email Address</label
        >
        <div class="iconInput">
          <i><app-email-icon /></i>
          <input
            class="form-control"
            type="email"
            formControlName="email"
            placeholder="Enter your email"
          />
          <small
            *ngIf="
              signupForm.get('email')?.invalid &&
              signupForm.get('email')?.touched
            "
          >
            Valid email is required
          </small>
        </div>
      </div>

      <!-- Contact Number -->
      <div class="mb-2">
        <label for="contactNumber" class="form-label">Contact Number</label>
        <div class="iconInput">
          <i><app-contact-number></app-contact-number></i>
          <input
            class="form-control"
            type="tel"
            formControlName="contactNumber"
            placeholder="Enter your number"
          />
          <small
            *ngIf="
              signupForm.get('contactNumber')?.invalid &&
              signupForm.get('contactNumber')?.touched
            "
          >
            Contact number is required
          </small>
        </div>
      </div>
    </div>

    <div class="mb-2">
      <app-password-strength-field
        [value]="signupForm.get('password')?.value"
        (valueChange)="signupForm.get('password')?.setValue($event)"
      />
    </div>
    <div class="mb-4">
      <label for="repeatPassword" class="form-label">Confirm Password</label>
      <div class="iconInput password">
        <i><app-password-icon /></i>
        <input
          class="form-control"
          [type]="showConfirmPassword ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Repeat your password"
        />
        <small
          *ngIf="passwordMismatch && signupForm.get('confirmPassword')?.touched"
          style="color: red"
        >
          Passwords do not match
        </small>
        <i class="right" (click)="toggleConfirmPasswordVisibility()">
          <app-password-show-icon
            *ngIf="!showConfirmPassword"
          ></app-password-show-icon>
          <app-password-hide-icon
            *ngIf="showConfirmPassword"
          ></app-password-hide-icon>
        </i>
      </div>
    </div>
    <div class="frmBtns">
      <!-- (click)="goToLogin()" -->
      <!-- [disabled]="signupForm.invalid || passwordMismatch" -->
      <button
        type="submit"
        class="btn btnCommon btnMinWidth"
        (click)="openOtpVerifyModal(otpVerifyContent)"
      >
        Verify Account
      </button>
    </div>
  </form>
</app-auth-form>

<div class="loginRoleSelection mb-4">
  <div class="loginRoleOptions">
    <label>
      <input
        type="radio"
        name="role"
        value="owner"
        [(ngModel)]="selectedRole"
        (change)="onRoleChange()"
      />
      <span>Owner</span>
    </label>
    <label>
      <input
        type="radio"
        name="role"
        value="property-manager"
        [(ngModel)]="selectedRole"
        (change)="onRoleChange()"
      />
      <span>Property Manager</span>
    </label>
    <label>
      <input
        type="radio"
        name="role"
        value="tenant"
        [(ngModel)]="selectedRole"
        (change)="onRoleChange()"
      />
      <span>Tenant</span>
    </label>
  </div>
</div>

<app-new-user-link type="login" />

<ng-template #otpVerifyContent let-modal>
  <div class="modal-body otpVerifyMdlBody">
    <div class="otpVerifyLogo">
      <a href="javascript:void(0);" (click)="goToLogin()">
        <img src="../../../../assets/mainLogo.svg" alt="Doqfy Logo" />
      </a>
    </div>
    <div class="otpVerifyMdlInfo my-4">
      <p>
        Please enter the Verification code sent to
        <span>hariprXXXX&#64;doqfy.in</span>&nbsp;<button
          type="button"
          (click)="modal.dismiss('Cross click')"
        >
          Edit
        </button>
      </p>
    </div>
    <div class="otpVerifyForm">
      <app-auth-form>
        <form>
          <div class="mb-2">
            <ng-otp-input
              class="formOtpInput"
              (onInputChange)="onOtpChange($event)"
              [config]="{
                length: 6,
                placeholder: '',
                disableAutoFocus: true,
                allowNumbersOnly: true
              }"
            ></ng-otp-input>
          </div>
          <div class="d-flex align-items-center justify-content-between mb-4">
            <div></div>
            Timer
            <app-timer-text
              *ngIf="otpSent && otpTimer > 0"
              [time]="timerDisplay"
            />
            Resend link
            <button
              *ngIf="showResend"
              type="button"
              class="link"
              (click)="resendOtp()"
            >
              Resend OTP
            </button>
          </div>
          <div class="frmBtns">
            <button
              type="button"
              class="btn btnCommon"
              (click)="goToResetPassword()"
            >
              Reset Password
            </button>
          </div>
        </form>
      </app-auth-form>
    </div>
  </div>
</ng-template>
