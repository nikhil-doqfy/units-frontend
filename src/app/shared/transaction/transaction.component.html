<div class="user-info" *ngIf="approvalData?.created_by">
  <span>User:</span> {{ approvalData.created_by }}
</div>

<div class="details" *ngIf="approvalData?.tenant">
  <div><strong>{{ approvalData.tenant }}</strong></div>
</div>

<div class="table-wrapper">
  <table class="validation-table">
    <thead>
      <tr>
        <th>Validation</th>
        <th>Entered Value</th>
        <th>Required Standard</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let v of violations">
        <td>{{ v.validation }}</td>
        <td>{{ v.entered }}</td>
        <td class="bold">{{ v.required }}</td>
      </tr>
      <tr *ngIf="violations.length === 0">
        <td colspan="3" style="text-align:center; color: var(--textMuted);">No violations found</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="footer mt-3">
  <span class="dot"></span>
  <button class="reject" [disabled]="isApproving" (click)="rejected.emit()">Reject</button>
  <button class="approve" [disabled]="isApproving" (click)="approved.emit()">
    {{ isApproving ? 'Approving…' : 'Approve' }}
  </button>
</div>
