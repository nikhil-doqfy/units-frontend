<div class="dcmntPrgrsBtn">
  <div class="dcmntPrgrsCrcl">
    <svg width="32" height="32" viewBox="0 0 120 120">
      <!-- Background Circle -->
      <circle
        cx="60"
        cy="60"
        r="50"
        stroke="#e0e0e0"
        stroke-width="10"
        fill="none"
      />

      <!-- Foreground Progress Circle (Dynamic Color) -->
      <circle
        cx="60"
        cy="60"
        r="50"
        [attr.stroke]="progressColor"
        stroke-width="10"
        fill="none"
        stroke-dasharray="314"
        [attr.stroke-dashoffset]="strokeDashoffset"
        stroke-linecap="round"
        transform="rotate(-90 60 60)"
      />
    </svg>
    <span [style.color]="progressColor">{{ documentsLeft }}</span>
  </div>
  <div class="dcmntPrgrsTxt d-none d-md-block">
    <span>Documents left</span>
    <p>Upgrade</p>
  </div>
</div>
