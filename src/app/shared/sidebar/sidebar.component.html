<div class="dashSdbrMain" [class.dashSdbrSmallMain]="!openSidebarValue">
  <div class="dashSdbrHdr">
    <div class="dashSdbrLogo">
      <a (click)="goToDashboard()">
        <img class="dashSdbrLogoImg" src="../../../../assets/mainLogo.svg" alt="Doqfy Logo" />
        <img class="dashSdbrLogoIcon" src="../../../../assets/mainLogoIcon.svg" alt="Doqfy Logo" />
      </a>
    </div>
    <div class="sdbrMenuBtn">
      <button (click)="handleOpenPopup()">
        <i class="open"><app-menu-open-icon /></i>
        <i class="close"><app-menu-close-icon /></i>
      </button>
    </div>
  </div>
  <div class="dashSdbrSearch">
    <input type="text" class="form-control" id="search" placeholder="Search here..." autocomplete="off" />
    <button type="button"><app-search-icon /></button>
  </div>
  <div class="dashSdbrList">

    <!-- Owner Menus Start -->
    <div class="dashSdbrWdgt" *ngIf="currentRole === 'owner'">
      <app-sidebar-heading title="Menu" />
      <div class="dashSdbrItemList">
        <app-sidebar-item title="Dashboard" href="/dashboard/home">
          <app-dashboard-icon></app-dashboard-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Properties" href="/dashboard/properties">
          <app-property-icon></app-property-icon>
        </app-sidebar-item>
        <app-sidebar-item title="PMC" href="/dashboard/pmc">
          <app-pmc-icon></app-pmc-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Tenants" href="/dashboard/tenants">
          <app-tenant-icon></app-tenant-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Lease/Tenancy" href="/dashboard/lease-tenancy">
          <app-lease-tenancy-icon></app-lease-tenancy-icon>
        </app-sidebar-item>
      </div>
    </div>
    <!-- Owner Menus End -->

    <!-- Property Manager Start Menus -->
    <div class="dashSdbrWdgt" *ngIf="currentRole === 'property-manager'">
      <app-sidebar-heading title="Menu" />
      <div class="dashSdbrItemList">
        <app-sidebar-item title="Dashboard" href="/dashboard/home">
          <app-dashboard-icon></app-dashboard-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Properties" href="/dashboard/properties">
          <app-property-icon></app-property-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Tenants" href="/dashboard/tenants">
          <app-tenant-icon></app-tenant-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Owners" href="/dashboard/owners">
          <app-owner-icon></app-owner-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Lease/Tenancy" href="/dashboard/lease-tenancy">
          <app-lease-tenancy-icon></app-lease-tenancy-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Approval" href="/dashboard/approval">
          <app-approval-icon></app-approval-icon>
        </app-sidebar-item>
      </div>
    </div>

    <div class="dashSdbrWdgt" *ngIf="currentRole === 'property-manager'">
      <app-sidebar-heading title="User Management" />
      <div class="dashSdbrItemList">
        <app-sidebar-item title="Users" href="/dashboard/users">
          <app-staff-icon></app-staff-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Staff" href="/dashboard/staff">
          <app-staff-icon></app-staff-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Roles & Permissions" href="/dashboard/roles-and-permissions">
          <app-roles-permissions-icon></app-roles-permissions-icon>
        </app-sidebar-item>
      </div>
    </div>
    <!-- Property Manager Menus End -->

    <!-- Tenant Menus Start -->
    <div class="dashSdbrWdgt" *ngIf="currentRole === 'tenant'">
      <app-sidebar-heading title="Menu" />
      <div class="dashSdbrItemList">
        <app-sidebar-item title="Properties" href="/dashboard/properties">
          <app-property-icon></app-property-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Documentations" href="/dashboard/documentations">
          <app-documentation-icon></app-documentation-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Payments & Invoice" href="/dashboard/payments-and-invoice">
          <app-payment-invoice-icon></app-payment-invoice-icon>
        </app-sidebar-item>
      </div>
    </div>
    <div class="dashSdbrWdgt" *ngIf="currentRole === 'tenant'">
      <app-sidebar-heading title="Others" />
      <div class="dashSdbrItemList">
        <app-sidebar-item title="Raise Complaint" href="/dashboard/raise-complaint">
          <app-raise-complaint-icon></app-raise-complaint-icon>
        </app-sidebar-item>
        <app-sidebar-item title="Privacy Policy" href="/dashboard/privacy-policy">
          <app-privacy-policy-icon></app-privacy-policy-icon>
        </app-sidebar-item>
      </div>
    </div>
    <div class="dashSdbrWdgt" *ngIf="currentRole === 'tenant'">
      <app-sidebar-support></app-sidebar-support>
    </div>
    <!-- Tenant Menus End -->
  </div>
</div>
<div *ngIf="!openSidebarValue" class="dashOverlay" (click)="handleOpenPopup()"></div>
