<div
  class="dashSdbrMain"
  [class.dashSdbrSmallMain]="!openSidebarValue"
  [ngClass]="{ arabic: currentLanguage === 'ar' }"
>
  <div class="dashSdbrHdr">
    <div class="dashSdbrLogo">
      <a (click)="goToDashboard()">
        <img
          class="dashSdbrLogoImg"
          src="../../../../assets/mainLogoWhite.svg"
          alt="Units Logo"
        />
        <img
          class="dashSdbrLogoIcon"
          src="../../../../assets/mainLogoIcon.svg"
          alt="Units Logo"
        />
      </a>
    </div>
    <div class="sdbrMenuBtn">
      <button (click)="handleOpenPopup()">
        <i class="open"><app-menu-open-icon /></i>
        <i class="close"><app-menu-close-icon /></i>
      </button>
    </div>
  </div>
  <div class="dashSdbrSearch">
    <input
      type="text"
      class="form-control"
      id="search"
      placeholder="{{ 'SEARCH_HERE' | translate }}"
      autocomplete="off"
      [ngModel]="searchQuery"
      (ngModelChange)="onSearchInput($event)"
      (keydown.escape)="closeSearch()"
    />
    <button type="button"><app-search-icon /></button>

    <div class="globalSearchDropdown" *ngIf="showSearchDropdown">
      <ng-container *ngIf="searchResults.length > 0; else noResults">
        <ng-container *ngFor="let group of groupedResults">
          <div class="searchGroupLabel">{{ group.type | titlecase }}</div>
          <div
            *ngFor="let result of group.items"
            class="searchResultItem"
            (click)="navigateToResult(result)"
          >
            <div class="resultInfo">
              <span class="resultLabel">{{ result.label }}</span>
              <span class="resultSubLabel">{{ result.sub_label }}</span>
            </div>
          </div>
        </ng-container>
      </ng-container>
      <ng-template #noResults>
        <div class="searchNoResult">No results found</div>
      </ng-template>
    </div>
  </div>
  <div class="dashSdbrList">
    <!-- Owner Menus Start -->
    <div class="dashSdbrWdgt" *ngIf="currentRole === 'owner'">
      <app-sidebar-heading title="{{ 'MENU' | translate }}" />
      <div class="dashSdbrItemList">
        <app-sidebar-item
          title="{{ 'DASHBOARD' | translate }}"
          href="/dashboard/home"
        >
          <app-dashboard-icon></app-dashboard-icon>
        </app-sidebar-item>
        <app-sidebar-item
          title="{{ 'PROPERTIES' | translate }}"
          href="/dashboard/properties"
        >
          <app-property-icon></app-property-icon>
        </app-sidebar-item>

        <app-sidebar-item title="{{ 'PMC' | translate }}" href="/dashboard/pmc">
          <app-pmc-icon></app-pmc-icon>
        </app-sidebar-item>
        <app-sidebar-item
          *ngIf="canAccess('Finance')"
          title="{{ 'FINANCE' | translate }}"
          href="/dashboard/finance"
          [exact]="false"
        >
          <app-pmc-icon></app-pmc-icon>
        </app-sidebar-item>
        <app-sidebar-item
          title="{{ 'TENANTS' | translate }}"
          href="/dashboard/tenants"
        >
          <app-tenant-icon></app-tenant-icon>
        </app-sidebar-item>
        <app-sidebar-item
          title="{{ 'LEASE_TENANCY' | translate }}"
          href="/dashboard/lease-tenancy"
        >
          <app-lease-tenancy-icon></app-lease-tenancy-icon>
        </app-sidebar-item>
        <app-sidebar-item
          title="{{ 'PAGE_TITLE.RENTAL_PORTFOLIO' | translate }}"
          href="/dashboard/rental"
        >
          <app-rental-portfolio-icon></app-rental-portfolio-icon>
        </app-sidebar-item>

        <app-sidebar-item
          title="{{ 'PAGE_TITLE.COMPLAINTS' | translate }}"
          href="/dashboard/complaints"
          [count]="complaintCount"
        >
          <app-raise-complaint-icon></app-raise-complaint-icon>
        </app-sidebar-item>
      </div>
    </div>
    <!-- Owner Menus End -->

    <!-- Property Manager Start Menus -->
    <div class="dashSdbrWdgt" *ngIf="currentRole === 'property-manager'">
      <app-sidebar-heading title="{{ 'MENU' | translate }}" />
      <div class="dashSdbrItemList">
        <app-sidebar-item
          title="{{ 'DASHBOARD' | translate }}"
          href="/dashboard/home"
        >
          <app-dashboard-icon></app-dashboard-icon>
        </app-sidebar-item>
        <app-sidebar-item
          *ngIf="canAccess('Properties')"
          title="{{ 'PROPERTIES' | translate }}"
          href="/dashboard/properties"
        >
          <app-property-icon></app-property-icon>
        </app-sidebar-item>
        <app-sidebar-item
          title="{{ 'LEADS' | translate }}"
          href="/dashboard/leads"
          [count]="leadsCount"
        >
          <app-lead-icon></app-lead-icon>
        </app-sidebar-item>
        <app-sidebar-item
          *ngIf="canAccess('Tenant')"
          title="{{ 'TENANTS' | translate }}"
          href="/dashboard/tenants"
        >
          <app-tenant-icon></app-tenant-icon>
        </app-sidebar-item>

        <app-sidebar-item
          *ngIf="canAccess('Owner')"
          title="{{ 'OWNER' | translate }}"
          href="/dashboard/owners"
        >
          <app-owner-icon></app-owner-icon>
        </app-sidebar-item>
        <app-sidebar-item
          *ngIf="canAccess('Finance')"
          title="{{ 'FINANCE' | translate }}"
          href="/dashboard/finance"
          [exact]="false"
        >
          <app-pmc-icon></app-pmc-icon>
        </app-sidebar-item>
        <app-sidebar-item
          title="{{ 'CHEQUES' | translate }}"
          href="/dashboard/cheques"
        >
          <app-cheques-icon></app-cheques-icon>
        </app-sidebar-item>
        <!-- <app-sidebar-item
          title="{{ 'LEASE_TENANCY' | translate }}"
          href="/dashboard/lease-tenancy"
        >
          <app-lease-tenancy-icon></app-lease-tenancy-icon>
        </app-sidebar-item> -->
        <app-sidebar-item
          *ngIf="canAccess('Rental Portfolio')"
          title="{{ 'PAGE_TITLE.RENTAL_PORTFOLIO' | translate }}"
          href="/dashboard/rental"
        >
          <app-rental-portfolio-icon></app-rental-portfolio-icon>
        </app-sidebar-item>
        <app-sidebar-item
          *ngIf="canAccess('Approval')"
          title="{{ 'APPROVAL' | translate }}"
          href="/dashboard/approval"
        >
          <app-approval-icon></app-approval-icon>
        </app-sidebar-item>

        <app-sidebar-item
          *ngIf="canAccess('Complaints')"
          title="{{ 'PAGE_TITLE.COMPLAINTS' | translate }}"
          href="/dashboard/complaints"
          [count]="complaintCount"
        >
          <app-raise-complaint-icon></app-raise-complaint-icon>
        </app-sidebar-item>
        <app-sidebar-item
          *ngIf="canAccess('Broadcast')"
          title="{{ 'PAGE_TITLE.BROADCAST' | translate }}"
          href="/dashboard/announcements"
        >
          <app-announcements-icon></app-announcements-icon>
        </app-sidebar-item>
      </div>
    </div>

    <div class="dashSdbrWdgt" *ngIf="currentRole === 'property-manager'">
      <app-sidebar-heading title="{{ 'USER_MANAGEMENT' | translate }}" />
      <div class="dashSdbrItemList">
        <app-sidebar-item title="{{ 'PMC' | translate }}" href="/dashboard/pmc">
          <app-pmc-icon></app-pmc-icon>
        </app-sidebar-item>
        <app-sidebar-item
          *ngIf="canAccess('Users')"
          title="{{ 'USERS' | translate }}"
          href="/dashboard/users"
        >
          <app-staff-icon></app-staff-icon>
        </app-sidebar-item>
        <app-sidebar-item
          title="{{ 'PAGE_TITLE.TEAM' | translate }}"
          href="/dashboard/staff"
        >
          <app-staff-icon></app-staff-icon>
        </app-sidebar-item>
        <app-sidebar-item
          *ngIf="canAccess('Roles and Permission')"
          title="{{ 'ROLES_AND_PERMISSIONS' | translate }}"
          href="/dashboard/roles-and-permissions"
        >
          <app-roles-permissions-icon></app-roles-permissions-icon>
        </app-sidebar-item>
        <app-sidebar-item
          title="{{ 'SUPPORT' | translate }}"
          href="/dashboard/raise-complaint"
        >
          <app-raise-complaint-icon></app-raise-complaint-icon>
        </app-sidebar-item>
      </div>
    </div>
    
    <!-- Property Manager Menus End -->

    <!-- Tenant Menus Start -->
    <div class="dashSdbrWdgt" *ngIf="currentRole === 'tenant'">
      <app-sidebar-heading title="{{ 'MENU' | translate }}" />
      <div class="dashSdbrItemList">
        <app-sidebar-item
          title="{{ 'PROPERTIES' | translate }}"
          href="/dashboard/properties"
        >
          <app-property-icon></app-property-icon>
        </app-sidebar-item>
        <app-sidebar-item
          title="{{ 'DOCUMENTATIONS' | translate }}"
          href="/dashboard/documentations"
        >
          <app-documentation-icon></app-documentation-icon>
        </app-sidebar-item>
        <app-sidebar-item
          title="{{ 'PAYMENTS_AND_INVOICE' | translate }}"
          href="/dashboard/payments-and-invoice"
        >
          <app-payment-invoice-icon></app-payment-invoice-icon>
        </app-sidebar-item>
      </div>
    </div>
    <div class="dashSdbrWdgt" *ngIf="currentRole === 'tenant'">
      <app-sidebar-heading title="{{ 'OTHERS' | translate }}" />
      <div class="dashSdbrItemList">
        <app-sidebar-item
          title="{{ 'SUPPORT' | translate }}"
          href="/dashboard/raise-complaint"
        >
          <app-raise-complaint-icon></app-raise-complaint-icon>
        </app-sidebar-item>
        <app-sidebar-item
          *ngIf="canAccess('Complaints')"
          title="{{ 'PAGE_TITLE.COMPLAINTS' | translate }}"
          href="/dashboard/complaints"
          [count]="complaintCount"
        >
          <app-raise-complaint-icon></app-raise-complaint-icon>
        </app-sidebar-item>
        <app-sidebar-item
          title="{{ 'PRIVACY_POLICY' | translate }}"
          href="/dashboard/privacy-policy"
        >
          <app-privacy-policy-icon></app-privacy-policy-icon>
        </app-sidebar-item>
      </div>
    </div>
    <div class="dashSdbrWdgt" *ngIf="currentRole === 'tenant'">
      <app-sidebar-support></app-sidebar-support>
    </div>
    <!-- Tenant Menus End -->
  </div>
</div>
<div
  *ngIf="!openSidebarValue"
  class="dashOverlay"
  (click)="handleOpenPopup()"
></div>
