<div class="dashSdbrItem" [class.dashSdbrSmallItem]="!openSidebarValue">
  <a
    routerLink="{{ href }}"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: exact }"
    ariaCurrentWhenActive="page"
    [placement]="tooltipPlacement"
    ngbTooltip="{{ title }}"
    tooltipClass="tltpCommon"
  >
    <i><ng-content /></i>
    <span>{{ title }}</span>
    <span *ngIf="count !== undefined" class="countBadge">
      {{ count }}
    </span>
  </a>
</div>
