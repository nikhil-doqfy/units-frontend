<div class="mb-4" [ngClass]="{ arabic: currentLanguage === 'ar' }">
  <app-white-card>
    <div class="top-filter-bar">
      <div class="left-controls">
        <div class="custom-select">
          <div class="custom-select-wrapper">
            <span class="select-icon">
              <app-users-icons></app-users-icons>
            </span>
            <app-custom-select
              class="with-left-icon"
              [placeholder]="'All Users'"
            ></app-custom-select>
          </div>

          <!-- TIME SELECT -->
          <div class="custom-select-wrapper">
            <span class="select-icon">
              <app-calender1-icon></app-calender1-icon>
            </span>
            <app-custom-select
              class="with-left-icon"
              [placeholder]="' All Time'"
            ></app-custom-select>
          </div>
        </div>
      </div>
      <div class="right-controls">
        <div class="search-box">
          <i><app-search-icon></app-search-icon></i>
          <input type="text" placeholder="Search here" />
        </div>
      </div>
      <span class="clear-icon"
        ><app-circular-cross-btn-icon></app-circular-cross-btn-icon
      ></span>
    </div>
  </app-white-card>
  <div class="mt-3">
    <app-white-card>
      <!-- <div class="logs-container"> -->
      <!-- Header -->
      <div class="logs-header">
        <h3>Logs</h3>
        <a href="#" class="download-link">
          <i><app-download-icon></app-download-icon></i> Download Log
        </a>
      </div>

      <!-- Timeline Wrapper -->
      <div class="timeline">
        <div class="timeline-item" *ngFor="let log of logs">
          <!-- Avatar + Vertical Line -->
          <div class="timeline-left">
            <img [src]="log.avatar" class="avatar" />
            <span class="vertical-line"></span>
          </div>

          <!-- Content -->
          <div class="timeline-content">
            <div class="user-row">
              <span class="username">{{ log.name }}</span>
              <span class="date">{{ log.date }}</span>
            </div>

            <div class="activity-box">
              <ul>
                <li *ngFor="let item of log.activities">
                  <div class="activity-title">• {{ item.title }}</div>
                  <div class="activity-sub">
                    {{ item.subtitle }}
                  </div>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <!-- </div> -->
    </app-white-card>
  </div>
</div>
