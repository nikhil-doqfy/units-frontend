<div class="mb-4" [ngClass]="{ arabic: currentLanguage === 'ar' }">
  <app-white-card>
    <div class="top-filter-bar">
      <div class="left-controls">
        <div class="custom-select">
          <div class="custom-select-wrapper">
            <span class="select-icon">
              <app-users-icons></app-users-icons>
            </span>
            <app-custom-select
              class="with-left-icon"
              [placeholder]="'ALL_USERS' | translate"
              [options]="userOptions"
              key="key"
              value="value"
              [selectedOption]="selectedUser"
              (optionSelected)="selectedUser = $event; onFilterChange()"
            ></app-custom-select>
          </div>

          <!-- TIME SELECT -->
          <div class="custom-select-wrapper">
            <span class="select-icon">
              <app-calender1-icon></app-calender1-icon>
            </span>
            <app-custom-select
              class="with-left-icon"
              [placeholder]="'ALL_TIME' | translate"
              [options]="timeOptions"
              key="key"
              value="value"
              [selectedOption]="selectedTime"
              (optionSelected)="selectedTime = $event; onFilterChange()"
            ></app-custom-select>
          </div>
        </div>
      </div>
      <div class="right-controls">
        <div class="search-box">
          <i><app-search-icon></app-search-icon></i>
          <input type="text" [placeholder]="'SEARCH_HERE' | translate"
            [(ngModel)]="searchText" (ngModelChange)="onFilterChange()" />
        </div>
      </div>
      <span class="clear-icon" style="cursor:pointer"
        (click)="searchText=''; selectedUser=null; selectedTime=null; onFilterChange()"
        ><app-circular-cross-btn-icon></app-circular-cross-btn-icon
      ></span>
    </div>
  </app-white-card>
  <div class="mt-3">
    <app-white-card>
      <!-- <div class="logs-container"> -->
      <!-- Header -->
      <div class="logs-header">
        <h3>{{ "LOGS" | translate }}</h3>
        <a href="#" class="download-link" (click)="$event.preventDefault(); downloadLogs()">
          <i><app-download-icon></app-download-icon></i>
          {{ "DOWNLOAD_LOG" | translate }}
        </a>
      </div>

      <!-- No data -->
      <app-no-data *ngIf="!displayLogs.length"></app-no-data>

      <!-- Timeline Wrapper -->
      <div class="timeline" *ngIf="displayLogs.length">
        <div class="timeline-item" *ngFor="let log of displayLogs">
          <!-- Avatar + Vertical Line -->
          <div class="timeline-left">
            <img *ngIf="log.avatar" [src]="log.avatar" class="avatar"
              (error)="log.avatar = null" />
            <div *ngIf="!log.avatar" class="avatar avatar-initials">
              {{ log.name ? (log.name.trim().split(' ')[0][0] + (log.name.trim().split(' ')[1]?.[0] || '')).toUpperCase() : '?' }}
            </div>
            <span class="vertical-line"></span>
          </div>

          <!-- Content -->
          <div class="timeline-content">
            <div class="user-row">
              <span class="username">{{ log.name }}</span>
              <span class="date">{{ log.date }}</span>
            </div>

            <div class="activity-box">
              <ul>
                <li *ngFor="let item of log.activities">
                  <div class="activity-title">• {{ item.title }}</div>
                  <div class="activity-sub">
                    {{ item.subtitle }}
                  </div>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <!-- </div> -->
    </app-white-card>
  </div>
</div>
