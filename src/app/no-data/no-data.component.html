<div class="no-data-container">
  <img
    src="../../assets/favicon/no-data.jpeg"
    alt="no data"
    class="no-data-img"
  />

  <h3 class="title">
    {{ "Currently no data found!" | translate }}
  </h3>

  <p class="subtitle">
    {{
      "This data table will update automatically whenever new data is available"
        | translate
    }}
  </p>
</div>
