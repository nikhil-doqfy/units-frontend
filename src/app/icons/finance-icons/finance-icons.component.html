@switch (icon) {
  @case ('overview') {
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8" />
      <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8" />
      <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8" />
      <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8" />
    </svg>
  }
  @case ('reports') {
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24">
      <path
        d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <polyline
        points="14 2 14 8 20 8"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <line x1="8" y1="13" x2="16" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      <line x1="8" y1="17" x2="13" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  }
  @case ('ar') {
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24">
      <path
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
      <rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="1.8" />
      <path d="M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  }
  @case ('bank') {
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24">
      <rect x="2" y="7" width="20" height="13" rx="2" stroke="currentColor" stroke-width="1.8" />

      <line x1="12" y1="12" x2="12" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      <line x1="10" y1="14" x2="14" y2="14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  }
  @case ('master') {
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24">
      <circle cx="5" cy="6" r="1.5" stroke="currentColor" stroke-width="1.7" />

      <line x1="2" y1="6" x2="3.5" y2="6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
