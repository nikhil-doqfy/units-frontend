<div class="custom-dropdown position-relative" (click)="$event.stopPropagation()">
  <button
    class="cmmnTblFltrBtn"
    [class.cmmnTblFltrIconBtn]="hasIcon"
    type="button"
    (click)="toggleDropdown()"
  >
    <ng-container *ngIf="hasIcon">
      <i><ng-content></ng-content></i>
    </ng-container>

    <span>{{ title }}</span>

    <i class="ms-1">
      <app-arrow-down-icon></app-arrow-down-icon>
    </i>
  </button>

  <div class="custom-menu" *ngIf="showReceiptDropdown">
    <div class="dropdown-item" (click)="selectReceiptType('rental')">
      Rental
    </div>
    <div class="dropdown-item" (click)="selectReceiptType('charges')">
      Other Charges
    </div>
    <div class="dropdown-item" (click)="selectReceiptType('combined')">
      Combined
    </div>
  </div>

  <div class="custom-menu filter-box month-dropdown" *ngIf="showMonthDropdown">
    <div *ngIf="loadingMonths" class="text-muted small py-2">Loading…</div>

    <ng-container *ngIf="!loadingMonths">
      <div *ngIf="!availableMonths.length" class="text-muted small py-2">
        No rent cheques found.
      </div>
      <div class="form-check mb-2" *ngFor="let m of availableMonths">
        <input
          type="checkbox"
          class="form-check-input"
          [id]="'month-' + m.key"
          [checked]="isMonthSelected(m.key)"
          (change)="toggleMonth(m.key)"
        />
        <label [for]="'month-' + m.key">{{ m.label }}</label>
      </div>

      <button
        class="btn generate-btn w-100"
        [disabled]="generating || !availableMonths.length"
        (click)="generateReceipt('RENTAL')"
      >
        {{ generating ? "Generating…" : "Generate" }}
      </button>
    </ng-container>
  </div>
</div>
