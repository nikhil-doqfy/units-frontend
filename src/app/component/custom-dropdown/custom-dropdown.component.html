<div class="custom-dropdown position-relative">
  <button
    class="cmmnTblFltrBtn"
    [class.cmmnTblFltrIconBtn]="hasIcon"
    type="button"
    (click)="toggleDropdown()"
  >
    <ng-container *ngIf="hasIcon">
      <i><ng-content></ng-content></i>
    </ng-container>

    <span>{{ title }}</span>

    <i class="ms-1">
      <app-arrow-down-icon></app-arrow-down-icon>
    </i>
  </button>

  <div class="custom-menu" *ngIf="showReceiptDropdown">
    <div class="dropdown-item" (click)="selectReceiptType('rental')">
      Rental
    </div>
    <div class="dropdown-item" (click)="selectReceiptType('charges')">
      Other Charges
    </div>
    <div class="dropdown-item" (click)="selectReceiptType('combined')">
      Combined
    </div>
  </div>

  <div class="custom-menu filter-box month-dropdown" *ngIf="showMonthDropdown">
    <div class="form-check">
      <input type="checkbox" class="form-check-input" id="jan" />
      <label for="jan">Jan 2025</label>
    </div>

    <div class="form-check mb-2">
      <input type="checkbox" class="form-check-input" id="feb" checked />
      <label for="feb">Feb 2025</label>
    </div>

    <div class="form-check mb-2">
      <input type="checkbox" class="form-check-input" id="mar" checked />
      <label for="mar">Mar 2025</label>
    </div>

    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" id="apr" />
      <label for="apr">Apr 2025</label>
    </div>

    <button class="btn generate-btn w-100">Generate</button>
  </div>
</div>
