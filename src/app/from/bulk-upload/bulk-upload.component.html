<div class="bulkImportWrapper">
  <!-- Info Box -->
  <div class="infoBox mb-3">
    <ul class="mb-0">
      <li>Download the sample Excel file, fill in the data, then upload it.</li>
      <li>Do not change the column headers in the sample file.</li>
    </ul>
  </div>

  <!-- Download Sample -->
  <div class="text-center mb-4">
    <button class="downloadbtn btn-transparent" (click)="sampleCsvDownload()">
      <img src="../../assets/XlsIcon.svg" alt="download" />
      {{ "DOWNLOAD_SAMPLE_CSV" | translate }}
    </button>
  </div>

  <app-upload-document
    [title]="'DROP_FILES_HERE' | translate"
    [isMultipleFiles]="false"
    [fileTypes]="['xlsx', 'xls']"
    [maxSize]="20"
    (uploadProgress)="onBulkUpload($event)"
  ></app-upload-document>

  <!-- Uploaded file preview -->
  <div class="uploadedFile mt-3" *ngIf="uploadedFile">
    <span>{{ uploadedFile.file.name }}</span>
    <span class="successText ms-2">
      {{ parsedRows.length }} row(s) ready to import
    </span>
  </div>

  <!-- Parse error -->
  <div class="errorMsg mt-2" *ngIf="parseError">{{ parseError }}</div>

  <!-- Preview table -->
  <div class="mt-3" *ngIf="parsedRows.length > 0">
    <table class="table table-sm table-bordered">
      <thead>
        <tr>
          <th *ngFor="let col of columns">{{ col.label }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of parsedRows">
          <td *ngFor="let col of columns">{{ row[col.key] }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
