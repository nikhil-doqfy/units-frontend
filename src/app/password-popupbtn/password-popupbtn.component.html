<div class="change-password-popup-btn">
  <button type="button" class="btn btnCommon1 px-1 py-0" (click)="togglePopup()">
    <app-password-icon></app-password-icon>
  </button>

  <div class="popup" *ngIf="isOpen">
    <app-password-popup
      (submitPassword)="handlePasswordChange($event)"
      (closePopup)="togglePopup()"
    ></app-password-popup>
  </div>
</div>
