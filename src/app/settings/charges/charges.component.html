<div class="mb-4">
  <app-white-card title="Charges"></app-white-card>
  <form [formGroup]="chargesForm">
    <div class="mt-3">
      <div class="cmmnTblHdr">
        <div class="row g-3 align-items-center">
          <div class="col-md">Add / Delete</div>
          <div class="col-md-auto">
            <button
              *ngIf="!showSave"
              class="btn btnCommonsx"
              (click)="addNewRow()"
            >
              <app-plus-icon></app-plus-icon>
              Add More
            </button>

            <button *ngIf="showSave" class="btn btnCommon" (click)="saveRow()">
              <i><app-save-icon></app-save-icon> </i>Save
            </button>
          </div>
        </div>
      </div>

      <div class="cmmnTblBody">
        <div class="table-responsive">
          <table class="charges-table">
            <thead>
              <tr>
                <th>Description</th>
                <th>Amount</th>
                <th>Tax Code</th>
                <th>VAT</th>
                <th>Editable</th>
                <th>Total Amount</th>
              </tr>
            </thead>

            <tbody formArrayName="charges">
              <tr *ngIf="!chargesArray.controls.length">
                <td colspan="6" align="center"><app-no-data /></td>
              </tr>
              <tr
                *ngFor="let c of chargesArray.controls; let i = index"
                [formGroupName]="i"
                class="charges-row"
              >
                <td>
                  {{ i + 1 }}
                  <input
                    *ngIf="c.value.isEdit || c.value.isNew"
                    class="inline-input"
                    placeholder="Enter here"
                    formControlName="description"
                  />
                  <span
                    *ngIf="!c.value.isEdit && !c.value.isNew"
                    (click)="editRow(i)"
                    class="desc-text"
                  >
                    {{ c.value.description }}
                  </span>
                </td>
                <td>
                  <input
                    *ngIf="c.value.isEdit || c.value.isNew"
                    class="inline-input"
                    type="number"
                    placeholder="Enter here"
                    formControlName="amount"
                  />

                  <span *ngIf="!c.value.isEdit && !c.value.isNew">
                    {{ c.value.amount | number: "1.2-2" }}
                  </span>
                </td>

                <td>
                  <input
                    *ngIf="c.value.isEdit || c.value.isNew"
                    class="inline-input"
                    placeholder="Enter here"
                    formControlName="tax_code"
                  />

                  <span *ngIf="!c.value.isEdit && !c.value.isNew">
                    {{ c.value.tax_code }}
                  </span>
                </td>

                <td>
                  <input
                    *ngIf="c.value.isEdit || c.value.isNew"
                    class="inline-input"
                    type="number"
                    placeholder="Enter here"
                    formControlName="vat"
                  />

                  <span *ngIf="!c.value.isEdit && !c.value.isNew">
                    {{ c.value.vat | number: "1.2-2" }}
                  </span>
                </td>

                <td class="text-center">
                  <div class="form-check form-switch">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      formControlName="is_editable"
                    />
                  </div>
                </td>

                <td class="total-cell">
                  <span>
                    {{ c.value.total | number: "1.2-2" }}
                  </span>

                  <div class="hover-actions">
                    <button class="btn btn-sm btn-edit" *ngIf="!c.value.isEdit">
                      <app-edit-icon (click)="editRow(i)"></app-edit-icon>
                    </button>
                    <button
                      *ngIf="c.value.isEdit"
                      class="saveBtn"
                      (click)="saveRow(i); $event.stopPropagation()"
                    >
                      Save
                    </button>
                    <button
                      class="btn btn-sm btn-delete"
                      (click)="deleteRow(i)"
                      *ngIf="!c.value.isEdit"
                    >
                      <app-delete-icon></app-delete-icon>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </form>
</div>
