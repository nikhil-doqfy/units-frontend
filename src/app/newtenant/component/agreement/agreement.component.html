<div class="top-alert" *ngIf="showMsg$()">
  <span class="icon"><app-warning-icon></app-warning-icon></span>
  <span class="text">{{ msgText$() }}</span>
</div>

<!-- MAIN CONTENT WRAPPER -->
<div class="page-wrapper mt-3" [class.blur]="showMsg$()">
  <app-white-card>
    <!-- Top Template Selector -->
    <div class="template-header">
      <app-custom-select
        placeholder="Temaplate: Lease Agreement"
      ></app-custom-select>
    </div>
  </app-white-card>
</div>
