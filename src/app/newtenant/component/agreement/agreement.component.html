<div
  class="top-alert"
  *ngIf="showMsg$()"
  [ngClass]="{
    'waiting-alert': msgText$() === 'Waiting for Signature',
    'success-alert': msgText$() === 'Signed Successfully',
  }"
>
  <span class="icon">
    <app-warning-icon *ngIf="msgText$() === 'Waiting for Signature'"></app-warning-icon>
    <app-signed-successfully-icon *ngIf="msgText$() === 'Signed Successfully'"></app-signed-successfully-icon>
  </span>
  <span class="text">{{ msgText$() }}</span>
</div>

<div class="pdf-viewer-wrapper mt-3" [class.blur]="showMsg$()">
  <div class="pdf-panel">

    <div *ngIf="pdfLoading" class="no-pdf">
      <div class="spinner"></div>
      <span>Loading agreement…</span>
    </div>

    @if (!pdfLoading && pdfUrl) {
      <iframe [src]="pdfUrl" class="pdf-object" title="Lease Agreement"></iframe>
    }

    <div *ngIf="!pdfLoading && !pdfUrl" class="no-pdf">
      <p>No document available.</p>
    </div>

  </div>
</div>
