<div class="top-alert" *ngIf="showMsg$()">
  <span class="icon"><app-warning-icon></app-warning-icon></span>
  <span class="text">{{ msgText$() }}</span>
</div>
<form [formGroup]="form">
  <app-white-card>
    <div class="success-wrapper">
      <div class="success-card">
        <img src="assets/Ejari-doc.svg" alt="success" class="success-icon" />

        <h3>Ejari document submitted successfully</h3>

        <p>It will be uploaded automatically once available,</p>

        <div class="upload-link">
          Or
          <span>
            <i class="upload-icon"><app-download-icon></app-download-icon></i>
            Upload Manually
          </span>
        </div>
      </div>
    </div>
  </app-white-card>
</form>
