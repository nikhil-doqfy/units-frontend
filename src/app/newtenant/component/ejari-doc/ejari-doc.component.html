<form [formGroup]="form">

      <div class="success-card">
        <img src="assets/Ejari-doc.svg" alt="success" class="success-icon" />

        <h3>{{ "EJARI_DOCUMENT_SUBMITTED" | translate }}</h3>

        <p>{{ "AUTO_UPLOAD" | translate }}</p>

        <div class="upload-link">
