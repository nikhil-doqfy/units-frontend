<app-white-card>
  <div class="stepper-container">
    <div class="sub-stepper" *ngIf="currentSubStep">
      <div class="sub-step active">
        {{ currentSubStep.title }}
        <span class="sub-desc">
          {{ currentSubStep.description || "" }}
        </span>
      </div>
    </div>
    <div
      class="step-item"
      *ngFor="let step of steps(); let i = index"
      [class.active]="i === activeIndex()"
      [class.completed]="i < activeIndex()"
    >
      <div class="circle">{{ i + 1 }}</div>
      <div class="label">{{ step.title }}</div>
      <div class="line" *ngIf="i < steps().length - 1"></div>
    </div>
    <div class="stepper-actions">
      <button class="btn-back" (click)="prev()">Back</button>
      <button class="cmmnTblFltrBtn">Add / Edit Fields</button>
      <button class="btn-next btn btnCommon" (click)="next()">
        Save & Next
      </button>
    </div>
  </div>
</app-white-card>
<div class="step-content">
  <ng-container *ngIf="currentSubStep">
    <ng-container
      *ngComponentOutlet="
        currentSubStep.component;
        inputs: { form: currentSubStep.formGroup }
      "
    ></ng-container>
  </ng-container>
</div>
