<app-white-card>
  <div class="stepper-container">
    <div class="sub-stepper" *ngIf="currentSubStep">
      <div class="sub-step active">
        {{ currentSubStep.title | translate }}
        <span class="sub-desc">
          {{ currentSubStep.description || "" | translate }}
        </span>
      </div>
    </div>
    <div class="step-item-container">
      <div
        class="step-item"
        *ngFor="let step of steps(); let i = index"
        [class.active]="i === activeIndex()"
        [class.completed]="i < activeIndex()"
      >
        <ng-container *ngIf="i < activeIndex(); else stepNumber">
          <i class="completeStepICon">
            <app-send-invite-icon></app-send-invite-icon>
          </i>
        </ng-container>
        <ng-template #stepNumber>
          <div class="circle">
            {{ i + 1 }}
          </div>
        </ng-template>

        <div class="label">{{ step.title | translate }}</div>

        <div class="line" *ngIf="i < steps().length - 1"></div>
      </div>
    </div>

    <div class="stepper-actions">
      <button
        class="btn-back"
        *ngIf="activeIndex() > 0 || subIndex() > 0"
        (click)="prev()"
      >
        <app-left-arrow-icon></app-left-arrow-icon>
      </button>
      <button
        class="btn-refresh"
        *ngIf="
          (currentSubStep?.component === ProfileComponent &&
            subIndex() === 0) ||
          currentSubStep?.component === EjariComponent ||
          currentSubStep?.component === EjariDocSignatureComponent ||
          showRefresh$()
        "
      >
        <app-refresh-icon></app-refresh-icon>
      </button>

      <button
        class="cmmnTblFltrBtn"
        *ngIf="
          !(
            currentSubStep?.component === OnboardingComponent ||
            currentSubStep?.component === ProfileComponent ||
            currentSubStep?.component === AgreementComponent ||
            currentSubStep?.component === EjariComponent ||
            currentSubStep?.component === EjariDocSignatureComponent
          )
        "
      >
        {{ "ADD_EDIT_FIELDS" | translate }}
      </button>

      <button
        class="reject-btn"
        *ngIf="
          getNextBtnLabel() === 'Approval & Generate Invoice' &&
          currentSubStep?.component === EjariDocSignatureComponent
        "
      >
        Reject
      </button>
      <button
        *ngIf="
          currentSubStep?.component !== OnboardingComponent &&
          !(
            currentSubStep?.component === EjariComponent &&
            getNextBtnLabel() === 'Approval & Generate Invoice'
          )
        "
        [ngClass]="{
          'profile-save-btn':
            currentSubStep?.component === ProfileComponent && subIndex() === 0,
          'save-btn':
            currentSubStep?.component !== ProfileComponent &&
            getNextBtnLabel() === 'Save & Next',
          'invite-btn': getNextBtnLabel() === 'Send Invite',
          'sign-btn': getNextBtnLabel() === 'Send for Signature',
          'submit-for-ejari': getNextBtnLabel() === 'Submit for Ejari',
          'Approval-Generate-invoice ':
            getNextBtnLabel() === 'Approval & Generate Invoice',
        }"
        (click)="next()"
      >
        {{ getNextBtnLabel() | translate }}
      </button>

      <div
        *ngIf="currentSubStep?.component === OnboardingComponent"
        class="send-negotiation-wrap"
      >
        <button class="send-negotiation-btn" (click)="onMainClick()">
          {{ btnTitle$() | translate }}

          <span
            *ngIf="btnTitle$() === 'Send Negotiation'"
            class="arrow-down"
            (click)="onArrowClick($event)"
            >|
            <app-arrow-down-icon></app-arrow-down-icon>
          </span>
        </button>
        <div class="approvalDropdown" *ngIf="isDropdownOpen">
          <div class="dropdownHeader">
            <h4>{{ "SEND_FOR_APPROVAL" | translate }}</h4>
            <button class="closeBtn" (click)="isDropdownOpen = false">✕</button>
          </div>

          <div class="dropdownBody">
            <label>{{ "SELECT_RECIPIENT" | translate }}</label>

            <div class="inputBox">
              {{ "TYPE_TO_SEARCH_USERS" | translate }}
            </div>
          </div>

          <div class="dropdownFooter">
            <button class="sendBtn">{{ "SEND" | translate }}</button>
          </div>
        </div>
      </div>
      <i *ngIf="getNextBtnLabel() !== 'Approval & Generate Invoice'">
        <app-circular-cross-btn-icon></app-circular-cross-btn-icon>
      </i>
    </div>
  </div>
</app-white-card>
<div class="step-content">
  <ng-container *ngIf="currentSubStep">
    <div *ngIf="showDummyLink" style="text-align: right; margin-bottom: 6px">
      <a
        href="javascript:void(0)"
        (click)="fillDummyData()"
        style="font-size: 12px; color: #aaa; text-decoration: underline; cursor: pointer"
      >Fill dummy data</a>
    </div>
    <ng-container
      *ngComponentOutlet="
        currentSubStep.component;
        inputs: getComponentInputs(currentSubStep)
      "
    ></ng-container>
  </ng-container>
</div>
