<div class="stepper-wrapper">
  <div
    class="stepper-item"
    *ngFor="let step of steps; let i = index"
    [class.active]="i === activeIndex()"
    [class.completed]="i < activeIndex()"
    (click)="goToStep(i)"
  >
    <div class="step-counter">
      <ng-container *ngIf="i < activeIndex(); else num">✓</ng-container>
      <ng-template #num>{{ i + 1 }}</ng-template>
    </div>
    <div class="step-name">{{ step.title }}</div>
  </div>
</div>

<div class="step-content">
  <ng-container *ngIf="currentSubStep">
    <ng-container *ngComponentOutlet="currentSubStep.component"></ng-container>
  </ng-container>
</div>

<div class="d-flex justify-content-between mt-4">
  <button class="btn btn-outline-secondary" (click)="prev()">Back</button>
  <button class="btn btn-primary" (click)="next()">Next</button>
</div>
