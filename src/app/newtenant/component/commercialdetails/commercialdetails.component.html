<form [formGroup]="form" class="commonForm">
  <!-- 01 Lessor Period -->
  <div class="sectionCard mt-3">
    <span class="sectionBadge">01</span>
    <h6 class="sectionTitle">Lessor Period</h6>
    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Start Date</label>
        <input type="date" class="form-control" formControlName="startDate" />
      </div>
      <div class="col-md-3">
        <label class="form-label">End Date</label>
        <input type="date" class="form-control" formControlName="endDate" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Grace Start Date</label>
        <input
          type="date"
          class="form-control"
          formControlName="graceStartDate"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Grace End Date</label>
        <input
          type="date"
          class="form-control"
          formControlName="graceEndDate"
        />
      </div>
    </div>
  </div>

  <!-- 02 Amount / Rent Details -->
  <div class="sectionCard mt-3">
    <span class="sectionBadge">02</span>
    <h6 class="sectionTitle">Amount / Rent Details</h6>
    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Annual Amount</label>
        <input
          type="number"
          class="form-control"
          placeholder="Enter here"
          formControlName="annualAmount"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Actual Annual Amount</label>
        <input
          type="number"
          class="form-control"
          placeholder="Enter here"
          formControlName="actualAnnualAmount"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Security / Booking Amount</label>
        <input
          type="number"
          class="form-control"
          placeholder="Enter here"
          formControlName="securityBookingAmount"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Maintenance Charges</label>
        <input
          type="number"
          class="form-control"
          placeholder="Enter here"
          formControlName="maintenanceCharges"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Rent</label>
        <input
          type="number"
          class="form-control"
          placeholder="Enter here"
          formControlName="rent"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Security Deposit</label>
        <input
          type="number"
          class="form-control"
          placeholder="Enter here"
          formControlName="securityDeposit"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Commission in %</label>
        <input
          type="number"
          class="form-control"
          placeholder="Enter here"
          formControlName="commissionPercent"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Notice Period (in months)</label>
        <input
          type="number"
          class="form-control"
          placeholder="Enter here"
          formControlName="noticePeriod"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Contract Amount</label>
        <input
          type="number"
          class="form-control"
          placeholder="Enter here"
          formControlName="contractAmount"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Discount (Optional)</label>
        <input
          type="number"
          class="form-control"
          placeholder="Enter here"
          formControlName="discount"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Shell & Core</label>
        <input
          type="text"
          class="form-control"
          placeholder="Enter here"
          formControlName="shellAndCore"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Payment Count</label>
        <input
          type="number"
          class="form-control"
          placeholder="Enter here"
          formControlName="paymentCount"
        />
      </div>
    </div>
  </div>
