<form [formGroup]="form">
  <app-white-card title="Photos & Documents">
    <div class="commonTabs">
      <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="tenantDocument-tab"
            data-bs-toggle="tab"
            data-bs-target="#tenantDocument-tab-pane"
            type="button"
            role="tab"
            aria-controls="tenantDocument-tab-pane"
            aria-selected="false"
          >
            Tenants Documents
          </button>
        </li>
      </ul>
    </div>
    <div class="commonTabsContent">
      <div class="tab-content" id="myTabContent">
        <div
          class="tab-pane fade show active"
          id="tenantDocument-tab-pane"
          role="tabpanel"
          aria-labelledby="tenantDocument-tab"
          tabindex="0"
        >
          <!-- <div class="row g-2">
            <div class="col-auto">
              <app-document-type-item title="Contract.pdf" size="1.2 MB" />
            </div>
            <div class="col-auto">
              <app-document-type-item title="Finances.png" size="1.2 MB" />
            </div>
            <div class="col-auto">
              <app-document-type-item title="Marketing.pdf" size="1.2 MB" />
            </div>
            <div class="col-auto">
              <app-document-type-item title="LaunchPlan.pdf" size="1.2 MB" />
            </div> 
          </div>-->
          <div class="row g-2 align-items-center docs-row">
            <div class="col-auto">
              <div class="doc-wrap success">
                <app-document-type-item
                  title="Bank Account.pdf"
                  size="1.2 MB"
                />
                <span class="status-icon check">✔</span>
              </div>
            </div>

            <div class="col-auto">
              <div class="doc-wrap warning">
                <app-document-type-item title="Emirates ID.pdf" size="1.2 MB" />
                <span class="replace-text">Replace</span>
                <span class="status-icon warn">⚠</span>
              </div>
            </div>

            <div class="col-auto">
              <div class="doc-wrap success">
                <app-document-type-item title="Other ID.pdf" size="1.2 MB" />
                <span class="status-icon check">✔</span>
              </div>
            </div>

            <!-- Upload More Button -->
            <div class="col-auto">
              <button class="upload-more-btn">
                <i class="upload-icon"
                  ><app-download-icon></app-download-icon
                ></i>
                Upload More<span>|</span
                ><i><app-arrow-down-icon></app-arrow-down-icon></i>
              </button>
            </div>

            <!-- Right Side Score -->
            <div
              class="col ms-auto d-flex align-items-center justify-content-end gap-2 score-section"
            >
              <a class="score-link">View Score Report</a>

              <div class="progress-circle">
                <span>97%</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </app-white-card>
  <div class="mt-3">
    <div class="rent-cheque-card">
      <!-- Header -->
      <div class="rent-header">
        <h6>Rent Cheques</h6>

        <div class="cheque-count">
          <span>No of Cheques:</span>
          <div class="counter">
            <button>-</button>
            <span>12</span>
            <button>+</button>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="cmmnTblBody">
        <div class="table-responsive">
          <table class="charges-table">
            <thead>
              <tr>
                <th><input type="checkbox" /></th>
                <th>Sl.No</th>
                <th>Reference ID</th>
                <th>Photo</th>
                <th>Rent Start & End Date</th>
                <th>Origin Bank</th>
                <th>Origin Account No.</th>
                <th>Origin IFSC Code</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- Footer -->
    </div>
  </div>
  <div class="mt-3">
    <app-white-card>
      <app-custom-select placeholder="Template:Lease Agreement">
      </app-custom-select>
    </app-white-card>
  </div>
</form>
