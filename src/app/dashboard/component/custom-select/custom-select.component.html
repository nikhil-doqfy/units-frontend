<div
  class="customSelect"
  [class.customSelectFilter]="isFilter"
  [class.customSelectPlain]="isPlain"
  [class.customSelectSmall]="isSmall"
  [class.customSelectGrey]="isGrey"
  [class.show]="isDropdownOpen"
  (click)="toggleDropdown()"
>
  <div class="customSelectInput">
    <span
      *ngIf="!selectedOption"
      class="customSelectPlaceholder"
      [innerHTML]="placeholder"
      >{{ placeholder }}</span
    >
    <span *ngIf="selectedOption">{{ selectedOption[value] }}</span>
    <i *ngIf="!isDropdownOpen">
      <app-arrow-down-icon />
    </i>
    <i *ngIf="isDropdownOpen">
      <app-arrow-up-icon />
    </i>
  </div>
  <ul *ngIf="isDropdownOpen" class="customSelectDropdown">
    <li *ngIf="showFilterInput || allowAddOption" class="customSelectSearch">
      <input
        type="text"
        [placeholder]="allowAddOption ? 'Search or Add...' : 'Add option...'"
        [(ngModel)]="filterText"
        (ngModelChange)="onInputChange($event)"
        (click)="$event.stopPropagation()"
        (keydown.enter)="$event.preventDefault(); $event.stopPropagation()"
      />

      <button
        *ngIf="allowAddOption"
        class="addBtn"
        (click)="addOption(); $event.stopPropagation()"
      >
        Add
      </button>
    </li>
    @for(option of displayOptions; track option[key]){
    <li
      (click)="selectOption(option); $event.stopPropagation()"
      [class.active]="option[key] === selectedOption?.[key]"
    >
      {{ option[value] }}
    </li>
    }@empty {
    <li>No Data Found</li>
    }
  </ul>
</div>
