<div class="customSelect" [ngStyle]="{ width: width }" [class.customSelectFilter]="isFilter"
  [class.customSelectPlain]="isPlain" [class.customSelectSmall]="isSmall" [class.customSelectGrey]="isGrey"
  [class.show]="isDropdownOpen" (click)="toggleDropdown()">
  <div class="customSelectInput" [class.highlight]="highlight">
    <span *ngIf="!selectedOption" class="customSelectPlaceholder">
      {{ placeholder | translate }}
    </span>

    <span *ngIf="selectedOption">
      {{ selectedOption[value] }}
    </span>

    <div class="rightSection">
      <span *ngIf="unitText" class="unitText">
        {{ unitText }}
      </span>

      <i>
        <app-arrow-down-icon *ngIf="!isDropdownOpen" />
        <app-arrow-up-icon *ngIf="isDropdownOpen" />
      </i>
    </div>
  </div>

  <ul *ngIf="isDropdownOpen" class="customSelectDropdown" [ngStyle]="dropdownStyle">
    <li *ngIf="showFilterInput || allowAddOption" class="customSelectSearch">
      <input type="text" [(ngModel)]="filterText" (ngModelChange)="onInputChange($event)"
        (click)="$event.stopPropagation()" placeholder="Search..." />

      <button *ngIf="allowAddOption" (click)="addOption(); $event.stopPropagation()">
        Add
      </button>
    </li>

    <li *ngFor="let option of displayOptions" (click)="selectOption(option); $event.stopPropagation()"
      [class.active]="option[key] === selectedOption?.[key]">
      {{ option[value] }}
    </li>

    <li *ngIf="!displayOptions.length">No Data Found</li>
  </ul>
</div>
