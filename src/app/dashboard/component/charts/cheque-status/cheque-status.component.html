<div class="chequeStatContainer">
  <div class="chequeStatMain">
    <h4 class="chequeStatTitle">Total Cheques - {{ totalCheques }}</h4>

    <div class="barWrapper">
      <div class="halfBar">
        <div
          class="realizedRemaining"
          [style.width.%]="realizedRemainingPercent"
        ></div>
        <div class="realizedFill" [style.width.%]="realizedFillPercent"></div>
        <div class="halfBarHover">
          <span></span>
          <div>
            <p>Realized cheques</p>
            <strong>{{ realized }} / {{ totalCheques }}</strong>
          </div>
        </div>
      </div>

      <div class="halfBar">
        <div class="bouncedFill" [style.width.%]="bouncedFillPercent"></div>
        <div
          class="bouncedRemaining"
          [style.width.%]="bouncedRemainingPercent"
        ></div>
        <div class="halfBarHover">
          <span></span>
          <div>
            <p>Bounced cheques</p>
            <strong>{{ bounced }} / {{ totalCheques }}</strong>
          </div>
        </div>
      </div>
    </div>

    <div class="chequeStatLabels">
      <span>Realized</span>
      <span>Bounced</span>
    </div>
  </div>

  <div class="agingBlockOuter">
    <div
      class="agingBlock"
      *ngFor="let item of agingData"
      [style.background]="item.bg"
    >
      <strong>{{ item.count }}</strong>
      <span>{{ item.label }}</span>
    </div>
  </div>

  <div class="chequeStatNote">
    <i><app-info-icon /></i
    >{{ "THE ABOVE MENTIONED ARE BOUNCED AGING CHEQUES" | translate }}
  </div>
</div>
