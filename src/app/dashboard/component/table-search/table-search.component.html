<div class="cmmnTblSrch" [class.expanded]="isSearchExpanded" #searchContainer>
  <button type="button"><app-search-icon /></button>
  <input
    type="text"
    id="search"
    [placeholder]="placeholder"
    [value]="searchText"
    autocomplete="off"
    (focus)="expandSearch()"
    (blur)="collapseSearch()"
    (input)="onInputChange($event)"
  />
</div>
