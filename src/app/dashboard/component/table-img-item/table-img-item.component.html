<div
  class="cmmnTblImgItem"
  [ngClass]="[size, clickable ? 'clickable' : '']"
  (click)="onClick()"
>
  <i *ngIf="img">
    <img [src]="img" [alt]="title" />
  </i>
  <i *ngIf="!img && showInitialsFallback" class="initialsAvatar">
    {{ initials }}
  </i>
  <div>
    <span>{{ title }}</span>
    <em *ngIf="subtitle">{{ subtitle }}</em>
  </div>
</div>
