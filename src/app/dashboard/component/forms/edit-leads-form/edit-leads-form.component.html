<form class="leadForm">
  <div class="row g-4">
    <div class="col-md-6 col-12">
      <label class="form-label required">{{
        "LINK_PROPERTY" | translate
      }}</label>
      <app-custom-select
        formControlName="property"
        value="Silchi Tower"
      ></app-custom-select>
    </div>

    <div class="col-md-6 col-12">
      <label class="form-label required">{{ "TENANT_NAME" | translate }}</label>
      <input class="form-control" value="Jensi" formControlName="tenantName" />
    </div>

    <div class="col-md-6 col-12">
      <label class="form-label required">{{ "EMAIL" | translate }}</label>
      <input
        class="form-control"
        value="Jensi@gmail.com"
        formControlName="email"
      />
    </div>

    <div class="col-md-6 col-12">
      <label class="form-label required">{{ "CONTACT" | translate }}</label>
      <input
        class="form-control"
        value="+41-9383822829"
        formControlName="contact"
      />
    </div>

    <div class="col-md-6 col-12">
      <label class="form-label required">{{
        "LEASE_AMOUNT_AED" | translate
      }}</label>
      <input class="form-control" value="1,200.00" formControlName="amount" />
    </div>

    <div class="col-md-6 col-12">
      <label class="form-label required">{{ "STATUS" | translate }}</label>
      <app-custom-select formControlName="status"></app-custom-select>
    </div>

    <div class="col-12">
      <label class="form-label required">{{ "COMMENT" | translate }}</label>
      <input class="form-control" value="Nill" formControlName="comment" />
    </div>

    <div class="col-12">
      <label class="form-label required">{{ "LEAD_SOURCE" | translate }}</label>

      <div class="sourceWrap">
        <label class="radioItem">
          <input type="radio" value="email" formControlName="source" />
          <span></span>{{ "EMAIL" | translate }}
        </label>

        <label class="radioItem">
          <input type="radio" value="call" formControlName="source" />
          <span></span> {{ "CALL" | translate }}
        </label>

        <label class="radioItem">
          <input type="radio" value="whatsapp" formControlName="source" />
          <span></span> {{ "WHATSAPP" | translate }}
        </label>
      </div>
    </div>

    <div class="col-12">
      <a class="sendLink">{{ "SEND_APP_LINK" | translate }}</a>
    </div>
  </div>
</form>
