<form class="addLeadForm">
  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <button
        class="nav-link"
        [class.active]="activeTab === 'manual'"
        (click)="setTab('manual')"
        type="button"
      >
        <!-- (click)="activeTab = 'manual'" -->

        {{ "MANUAL" | translate }}
      </button>
    </li>
    <li class="nav-item">
      <button
        class="nav-link"
        [class.active]="activeTab === 'bulk'"
        (click)="setTab('bulk')"
        type="button"
      >
        <!-- (click)="activeTab = 'bulk'" -->
        {{ "BULK_IMPORT" | translate }}
      </button>
    </li>
  </ul>

  <div *ngIf="activeTab === 'manual'">
    <!-- Manual form content -->

    <div class="row g-3">
      <!-- Link Property -->
      <div class="col-md-6">
        <label class="form-label required">{{
          "LINK_PROPERTY" | translate
        }}</label>
        <!-- <select class="form-select" formControlName="property">
          <option value="">--Select--</option>
        </select> -->

        <app-custom-select
          [options]="unitOptions"
          key="key"
          value="value"
          [showFilterInput]="true"
          [placeholder]="'SELECT_OPTION' | translate"
          (optionSelected)="onUnitSelect($event)"
        ></app-custom-select>
      </div>

      <!-- Tenant Name -->
      <div class="col-md-6">
        <label class="form-label required">{{
          "TENANT_NAME" | translate
        }}</label>
        <input
          type="text"
          class="form-control"
          [placeholder]="'ENTER_NAME_HERE' | translate"
          formControlName="tenantName"
        />
      </div>

      <!-- Email -->
      <div class="col-md-6">
        <label class="form-label required">{{ "EMAIL" | translate }}</label>
        <input
          type="email"
          class="form-control"
          [placeholder]="'ENTER_EMAIL_HERE' | translate"
          formControlName="email"
        />
      </div>

      <!-- Contact -->
      <div class="col-md-6">
        <label class="form-label required">{{ "CONTACT" | translate }}</label>
        <input
          type="text"
          class="form-control"
          [placeholder]="'ENTER_NAME_HERE' | translate"
          formControlName="contact"
        />
      </div>

      <!-- Amount -->
      <div class="col-md-6">
        <label class="form-label required">
          {{ "LEASE_AMOUNT_AED" | translate }}
        </label>
        <input
          type="number"
          class="form-control"
          [placeholder]="'ENTER_AMOUNT' | translate"
          formControlName="amount"
        />
      </div>

      <!-- Status -->
      <div class="col-md-6">
        <label class="form-label required">{{ "STATUS" | translate }}</label>
        <!-- <select class="form-select" formControlName="status">
          <option value="">--Select--</option>
        </select> -->
        <app-custom-select></app-custom-select>
      </div>

      <!-- Source of Lead -->
      <div class="col-12">
        <label class="form-label required">{{
          "LEAD_SOURCE" | translate
        }}</label>
        <div class="d-flex gap-4">
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              value="direct"
              formControlName="source"
            />
            <label class="form-check-label">{{ "DIRECT" | translate }}</label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              value="referral"
              formControlName="source"
            />
            <label class="form-check-label">{{ "REFERRAL" | translate }}</label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              value="platform"
              formControlName="source"
            />
            <label class="form-check-label">{{ "PLATFROM" | translate }}</label>
          </div>
        </div>
      </div>

      <!-- Referral Name -->
      <div class="col-md-6">
        <label class="form-label required">{{
          "REF_TENANT_ID_NAME" | translate
        }}</label>
        <input
          type="text"
          class="form-control"
          [placeholder]="'ENTER_HERE' | translate"
          formControlName="referralName"
        />
      </div>

      <!-- Referral Contact -->
      <div class="col-md-6">
        <label class="form-label required">{{
          "REFERRAL_CONTACT" | translate
        }}</label>
        <input
          type="text"
          class="form-control"
          [placeholder]="'ENTER_NUMBER_HERE' | translate"
          formControlName="referralContact"
        />
      </div>

      <!-- Checkbox -->
      <div class="col-12">
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            formControlName="sendAppLink"
          />
          <label class="form-check-label small">
            {{ "APP_LINK_SENT_ON_LEAD_CREATE" | translate }}
          </label>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="activeTab === 'bulk'" class="bulkImportWrapper">
    <!-- Info Box -->
    <div class="infoBox mb-3">
      <ul class="mb-0">
        <li>
          {{ "IMPORT_CONTACTS_VIA_CSV" | translate }}
        </li>
        <li>
          {{ "VERIFY_NAME_EMAIL_FIELDS" | translate }}
        </li>
      </ul>
    </div>

    <!-- Download CSV -->
    <div class="text-center mb-4">
      <button class="downloadbtn btn-transparent" (click)="sampleCsvDownload()">
        <img src="../../assets/XlsIcon.svg" alt="download" />
        {{ "DOWNLOAD_SAMPLE_CSV" | translate }}
      </button>
    </div>
    <app-upload-document
      [title]="'DROP_FILES_HERE' | translate"
      [isMultipleFiles]="false"
      [fileTypes]="['pdf']"
      [maxSize]="20"
      (uploadProgress)="onBulkUpload($event)"
    ></app-upload-document>

    <!-- Uploaded file preview -->
    <div class="uploadedFile mt-3" *ngIf="uploadedFile">
      <span>{{ uploadedFile.file.name }}</span>
      <span class="successText">{{ "UPLOADED" | translate }}</span>
    </div>
  </div>
</form>
