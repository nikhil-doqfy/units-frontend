<form class="commonForm" [formGroup]="complaintForm">
  <div class="row g-3">
    <!-- Link Property + Unit -->
    <div class="col-md-6">
      <label class="form-label">{{ "SELECT_PMC" | translate }}</label>
      <app-custom-select
        [options]="pmcOptions"
        key="key"
        value="value"
        formControlName="pmc"
        [placeholder]="'SELECT_PMC' | translate"
        [selectedOption]="selectedPmc"
        (optionSelected)="onPmcSelected($event)"
      ></app-custom-select>
    </div>
    <div class="col-md-6">
      <app-form-select-field
        [label]="'LINK_PROPERTY' | translate"
        [required]="true"
        [options]="propertyOptions"
        [showFilterInput]="true"
        [placeholder]="'SELECT_OPTION' | translate"
        (optionSelected)="onPropertySelect($event)"
      ></app-form-select-field>
    </div>

    <div class="col-md-6">
      <app-form-select-field
        [label]="'UNIT' | translate"
        [required]="true"
        [options]="unitOptions"
        [showFilterInput]="true"
        [placeholder]="'SELECT_OPTION' | translate"
        [form]="leadForm"
        controlName="unit_id"
        (optionSelected)="onUnitSelect($event)"
      ></app-form-select-field>
    </div>

    <div class="col-md-6">
      <app-form-select-field
        label="Service Type"
        [required]="true"
        [options]="serviceTypeOptions"
        [form]="complaintForm"
        controlName="service_type"
        [placeholder]="'SELECT_OPTION' | translate"
        (optionSelected)="
          complaintForm.patchValue({ service_type: $event?.key })
        "
      ></app-form-select-field>
    </div>

    <div class="col-md-6">
      <app-form-select-field
        label="Priority"
        [required]="true"
        [options]="priorityOptions"
        [form]="complaintForm"
        controlName="priority"
        [placeholder]="'SELECT_OPTION' | translate"
        (optionSelected)="complaintForm.patchValue({ priority: $event?.key })"
      ></app-form-select-field>
    </div>

    <div class="col-md-6">
      <label class="form-label">Note</label>
      <input
        type="text"
        class="form-control"
        placeholder="Please bring tools"
        formControlName="note"
      />
    </div>

    <div class="col-12">
      <label class="form-label"
        >{{ "DESCRIPTION" | translate }}<span>*</span></label
      >
      <textarea
        rows="3"
        class="form-control"
        [class.is-invalid]="isInvalid(complaintForm, 'description').status"
        placeholder="Electrical wiring issue"
        formControlName="description"
      ></textarea>
      @if (isInvalid(complaintForm, "description").status) {
        <small class="errorMsg">{{
          isInvalid(complaintForm, "description").msg
        }}</small>
      }
    </div>

    <div class="col-md-4">
      <label class="form-label">Slot 1<span>*</span></label>
      <input
        type="date"
        class="form-control"
        [class.is-invalid]="isInvalid(complaintForm, 'slot_1').status"
        formControlName="slot_1"
      />
      @if (isInvalid(complaintForm, "slot_1").status) {
        <small class="errorMsg">{{
          isInvalid(complaintForm, "slot_1").msg
        }}</small>
      }
    </div>

    <div class="col-md-4">
      <label class="form-label">Slot 2</label>
      <input type="date" class="form-control" formControlName="slot_2" />
    </div>

    <div class="col-md-4">
      <label class="form-label">Slot 3</label>
      <input type="date" class="form-control" formControlName="slot_3" />
    </div>

    <div class="col-12">
      <label class="form-label">Upload Images</label>
      <app-upload-document
        [isMultipleFiles]="true"
        [fileTypes]="['jpg', 'jpeg', 'png']"
        [maxSize]="20"
        (uploadProgress)="onImageUpload($event)"
      ></app-upload-document>

      <div class="uploads-list mt-3" *ngIf="uploadedImages.length">
        <app-file-upload-item
          *ngFor="let image of uploadedImages"
          [item]="image"
          (remove)="removeImage(image.tempId)"
        ></app-file-upload-item>
      </div>
    </div>
  </div>
</form>
