<app-modal-form-card>
  <form [formGroup]="invitePmcForm">
    <div class="mb-0">
      <div class="col-md-6">
        <label class="form-label"> {{ "PROPERTY_NAME" | translate }} * </label>

        <app-custom-select
          [options]="propertyList"
          placeholder="Select Property"
          key="key"
          value="value"
          [selectedOption]="selectedProperty"
          (optionSelected)="onOptionSelectedPropertyUnit($event)"
          (click)="onSelectClickPropertyUnit()"
        ></app-custom-select>
      </div>
      <label for="email" class="form-label"
        >{{ "EMAIL_ADDRESS" | translate }}<span>*</span></label
      >
      <input
        class="form-control"
        type="email"
        name="email"
        formControlName="email"
        [placeholder]="'ENTER_EMAIL_ADDRESS_HERE' | translate"
      />
    </div>
  </form>
</app-modal-form-card>
