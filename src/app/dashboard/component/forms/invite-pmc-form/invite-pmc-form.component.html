<app-modal-form-card>
  <form>
    <div class="mb-0">
      <label for="email" class="form-label"
        >{{ "EMAIL_ADDRESS" | translate }}<span>*</span></label
      >
      <input
        class="form-control"
        type="email"
        name="email"
        [placeholder]="'ENTER_EMAIL_ADDRESS_HERE' | translate"
      />
    </div>
  </form>
</app-modal-form-card>
