<div class="cmmnTblViewCol">
  <div class="cmmnTblViewHdr">
    <div class="cmmnTblViewTtl">
      <i *ngIf="showImage">
        <ng-container *ngIf="imgSrc; else noImg">
          <img [src]="imgSrc" alt="" (error)="imgSrc = ''" />
        </ng-container>
        <ng-template #noImg>
          <div class="avatar">{{ titleInitial }}</div>
        </ng-template>
      </i>
      <div>
        <h4>{{ title }}</h4>

        <ul *ngIf="headerItems.length > 0">
          <li *ngFor="let h of headerItems">
            {{ h.label }}: <span>{{ h.value || "--" }}</span>
          </li>
        </ul>
      </div>
    </div>
    <div class="cmmnTblViewBtns">
      <button
        *ngIf="showEdit"
        type="button"
        class="cmmnTblViewEditBtn"
        (click)="onEditClick()"
      >
        <app-edit-icon />
      </button>
      <div class="column">
        <!-- *ngIf="hasProjectedContent; else noActionButtons" -->
        <button
          *ngIf="showBack"
          type="button"
          class="btn btnWhite btnCommon"
          (click)="onBackClick()"
        >
          <i><app-back-icon /></i>{{ "BACK" | translate }}
        </button>

        <button
          class="btn btnCommon btnWhite"
          *ngIf="showDownload"
          (click)="download.emit('pdf')"
        >
          <i><app-download-icon></app-download-icon></i>
          Download
        </button>

        <!-- <div class="dropdownWrap" *ngIf="showShare">
          <button class="btn btnCommon btnWhite" (click)="toggleShare()">
            <i><app-whatsapp-share-icon></app-whatsapp-share-icon></i>
            Share <app-arrow-down-icon *ngIf="!openShare"></app-arrow-down-icon>
            <app-arrow-up-icon *ngIf="openShare"></app-arrow-up-icon>
          </button>

          <div class="shareDropdown" *ngIf="openShare">
            <label class="shareItem">
              <input type="checkbox" [(ngModel)]="shareOptions.whatsapp" />
              <span class="icon whatsapp"
                ><img src="assets/whatsapp.png"
              /></span>
              Whatsapp
            </label>

            <label class="shareItem">
              <input type="checkbox" [(ngModel)]="shareOptions.mail" />
              <span class="icon mail">
                <img src="assets/email.svg" />
              </span>
              Mail
            </label>

            <label class="shareItem">
              <input type="checkbox" [(ngModel)]="shareOptions.sms" />
              <span class="icon sms">
                <img src="assets/text-icon.svg" />
              </span>
              Text Message
            </label>

            <button class="doneBtn" (click)="shareSelected()">Done</button>
          </div>
        </div> -->
        <div ngbDropdown class="dropdownWrap" *ngIf="showShare">
          <button class="btn btnCommon btnWhite" ngbDropdownToggle>
            <i><app-whatsapp-share-icon></app-whatsapp-share-icon></i>
            Share
            <app-arrow-down-icon *ngIf="!openShare"></app-arrow-down-icon>
            <app-arrow-up-icon *ngIf="openShare"></app-arrow-up-icon>
          </button>

          <div ngbDropdownMenu class="shareDropdown">
            <label class="shareItem">
              <input type="checkbox" [(ngModel)]="shareOptions.whatsapp" />
              <span class="icon whatsapp">
                <img src="assets/whatsapp.png" />
              </span>
              Whatsapp
            </label>

            <label class="shareItem">
              <input type="checkbox" [(ngModel)]="shareOptions.mail" />
              <span class="icon mail">
                <img src="assets/email.svg" />
              </span>
              Mail
            </label>

            <label class="shareItem">
              <input type="checkbox" [(ngModel)]="shareOptions.sms" />
              <span class="icon sms">
                <img src="assets/text-icon.svg" />
              </span>
              Text Message
            </label>

            <button class="doneBtn" (click)="shareSelected()">Done</button>
          </div>
        </div>
        <button
          *ngIf="showCloseBtn"
          type="button"
          class="btn"
          (click)="onCloseClick()"
        >
          <i><app-circular-cross-btn-icon></app-circular-cross-btn-icon></i>
        </button>
        <div class="actionRow">
          <ng-content select="[header-actions]"></ng-content>
        </div>
      </div>
      <ng-content select="[rental-btn]"></ng-content>
      <ng-template #noActionButtons>
        <button
          type="button"
          class="btnWhite btnCommon"
          (click)="onBackClick()"
        >
          <i><app-back-icon /></i> {{ "BACK" | translate }}
        </button>
      </ng-template>
    </div>
  </div>
  <div class="cmmnTblViewBdy">
    <ng-content select="[body-summary]"></ng-content>
    <ul>
      <li *ngFor="let item of items">
        <span>{{ item.label }}</span>
        <p *ngIf="!item.link">{{ item.value || "--" }}</p>
        <p *ngIf="item.link">
          <a [href]="item.link">{{ item.value }}</a>
        </p>
      </li>
    </ul>
    <div class="rentalActions">
      <ng-content select="[rental]"></ng-content>
    </div>
  </div>
</div>
