<app-white-card title="Your Statistics">
    <div class="row g-3">
        <div class="col-lg-3">
            <app-stats-card [stats]="[
                { label: 'Monthly Commission', value: 'AED 1,20,573' }
            ]">
                <ng-container icon>
                    <app-graph-stats-icon />
                </ng-container>
                <ng-container action>
                    <app-custom-select [options]="['Sep 2025', 'Aug 2025', 'Sep 2025', 'Oct 2025']"
                        [placeholder]="selectedMonthly" [selectedOption]="selectedMonthly"
                        (optionSelected)="onOptionSelectedMonthly($event)" [isFilter]="true" [isPlain]="true">
                    </app-custom-select>
                </ng-container>
            </app-stats-card>
        </div>
        <div class="col-lg-9">
            <div class="row g-3">
                <div class="col-md-6">
                    <app-stats-card [title]="'Properties'" [stats]="[
                        { label: 'Total', value: '240' },
                        { label: 'Rented', value: '12' },
                        { label: 'Vacant', value: '438' }
                    ]">
                        <ng-container icon>
                            <app-property-stats-icon />
                        </ng-container>
                    </app-stats-card>
                </div>
                <div class="col-md-6">
                    <app-stats-card [title]="'Tenants'" [stats]="[
                        { label: 'Active', value: '450' },
                        { label: 'Upcoming Renewals', value: '180' },
                        { label: 'Negotiations', value: '438' }
                    ]">
                        <ng-container icon>
                            <app-tenant-stats-icon />
                        </ng-container>
                    </app-stats-card>
                </div>
            </div>
        </div>
    </div>
</app-white-card>

<div class="mt-3">
    <div class="row g-3">
        <div class="col-lg-5">
            <app-white-card title="Most Revenue Generating Properties">
                <app-progress-bar-table [rows]="propertyData"></app-progress-bar-table>
            </app-white-card>
        </div>
        <div class="col-lg-7">
            <app-white-card title="Revenue" subtitle="Monthly recurring revenue - AED 54,352" [showActions]="true"
                customClass="pb-0">
                <ng-container card-actions>
                    <app-filter-popup-btn>
                        <ng-container form>
                            <form>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Location</label>
                                        <app-custom-select
                                            [options]="['All', 'Dubai hills golf club', 'Silicon central mall', 'Falcon city of wonders', 'Majan']"
                                            [selectedOption]="selectedFilter"
                                            (optionSelected)="onOptionSelectedFilter($event)">
                                        </app-custom-select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Unit</label>
                                        <app-custom-select [options]="['Sep 2025', 'Aug 2025', 'Sep 2025', 'Oct 2025']"
                                            [selectedOption]="selectedFilter"
                                            (optionSelected)="onOptionSelectedFilter($event)">
                                        </app-custom-select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Date Range</label>
                                        <label class="form-label small">From</label>
                                        <div class="datePicker">
                                            <input class="form-control" placeholder="DD-MM-YYYY" name="dp"
                                                [(ngModel)]="model" ngbDatepicker #d="ngbDatepicker" />
                                            <button type="button" (click)="d.toggle()">
                                                <app-date-icon />
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label d-none d-md-block">&nbsp;</label>
                                        <label class="form-label small">To</label>
                                        <div class="datePicker">
                                            <input class="form-control" placeholder="DD-MM-YYYY" name="dp"
                                                [(ngModel)]="model" ngbDatepicker #d="ngbDatepicker" />
                                            <button type="button" (click)="d.toggle()">
                                                <app-date-icon />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </ng-container>
                        <ng-container action>
                            <button type="button" class="btn btnCommon">Apply</button>
                        </ng-container>
                    </app-filter-popup-btn>
                </ng-container>
                <app-column-chart></app-column-chart>
            </app-white-card>
        </div>
    </div>
</div>

<div class="mt-3">
    <div class="row g-3">
        <div class="col-lg-5">

                                <div class="row g-3">
                                    <div class="col-md-6">

                                        <app-custom-select

                                            [selectedOption]="selectedFilter"

                                        </app-custom-select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Unit</label>
                                        <app-custom-select [options]="['Sep 2025', 'Aug 2025', 'Sep 2025', 'Oct 2025']"
                                            [selectedOption]="selectedFilter"
                                            (optionSelected)="onOptionSelectedFilter($event)">
                                        </app-custom-select>
                                    </div>
                                </div>
                            </form>
                        </ng-container>
                        <ng-container action>
                            <button type="button" class="btn btnCommon">Apply</button>

                    </app-filter-popup-btn>
                </ng-container>
                <app-line-chart></app-line-chart>
            </app-white-card>

<div class="mt-3">

                            </ng-container>

                </div>
                <div class="cmmnTblBody">
