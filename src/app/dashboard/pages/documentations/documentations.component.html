<div class="cmmnTblOuter">
  <div class="cmmnTblHdr">
    <div class="row align-items-center">
      <div class="col-md">
        <app-table-title
          title="{{ 'DOCUMENTS' | translate }}"
          subtitle="5"
        ></app-table-title>
      </div>
      <div class="col-md-auto">
        <div class="d-flex align-items-center gap-2 gap-md-3">
          <app-custom-select
            [options]="[
              'Falcom city',
              'Novatis AG...',
              'Agriculture',
              'Honda',
              'TVS',
              'Samsung',
            ]"
            [placeholder]="selected"
            [selectedOption]="selected"
            (optionSelected)="onOptionSelected($event)"
            [isFilter]="true"
          >
          </app-custom-select>
          <app-table-filter-btn
            [title]="'EXPORT' | translate"
            [hasIcon]="true"
            (clicked)="handleExportClick()"
          >
            <app-export-icon />
          </app-table-filter-btn>
          <button
            *ngIf="currentRole === 'tenant'"
            class="btn btn-primary"
            (click)="openTenantDocumentUpload(uploadTenantDocumentModal)"
          >
            Upload
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="cmmnTbl">
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>{{ "SI.CODE" | translate }}</th>
            <th>{{ "AGREEMENT_NAME" | translate }}</th>
            <th>{{ "STAUES" | translate }}</th>
            <th width="200">{{ "DOCUMENT" | translate }}</th>
          </tr>
        </thead>
        <tbody>
          <!-- @for (property of documentationList; track $index){ -->

          <tr *ngFor="let document of tenantDocuments; let i = index">
            <td>{{ document.tenant_code }}</td>

            <td>{{ document.file_name }}</td>

            <td>
              <app-badge [title]="document.document_type_name" status="green">
              </app-badge>
            </td>

            <td align="center">
              <div class="cmmnTblActnBtnDiv">
                <app-table-action-btn
                  type="download"
                  (clicked)="downloadDocument(document)"
                >
                </app-table-action-btn>

                <app-table-action-btn
                  type="preview"
                  (clicked)="previewDocument(document)"
                >
                </app-table-action-btn>
              </div>
            </td>
          </tr>

          <tr *ngIf="!tenantDocuments.length">
            <td colspan="4" align="center">
              <app-no-data></app-no-data>
            </td>
          </tr>
        </tbody>

  </div>
  <div class="cmmnTblFtr">
    <app-table-select />
    <app-table-pagination />
  </div>
  <ng-template #uploadTenantDocumentModal let-modal>
    <div class="modal-header">
      <h6 class="modal-title">
        {{ "UPLOAD_TENANT_DOCUMENT" | translate }}
      </h6>

      <button
        type="button"
        class="btn-close"
        aria-label="Close"
        (click)="modal.dismiss('Cross click')"
      ></button>
    </div>

    <div class="modal-body">
      <app-tenant-document-upload
        #tenantDocumentUploadComponent
        (documentUploaded)="onDocumentUploaded($event, modal)"
      >
      </app-tenant-document-upload>
    </div>

    <div class="modal-footer">
      <button
        type="button"
        class="btn btnCommon btnTransparent"
        (click)="modal.dismiss('Cancel click')"
      >
        {{ "CANCEL" | translate }}
      </button>

      <button
        type="button"
        class="btn btnCommon"
        (click)="tenantDocumentUploadComponent.uploadDocument()"
      >
        {{ "UPLOAD_DOCUMENT" | translate }}
      </button>
    </div>
  </ng-template>
</div>
