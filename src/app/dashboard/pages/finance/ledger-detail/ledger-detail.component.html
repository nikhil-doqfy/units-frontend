<app-finance-empty-state
  *ngIf="financeActivation !== 'activated'"
  [financeActivation]="financeActivation"
  title="FINANCE_LEDGER_DETAIL"
></app-finance-empty-state>

<ng-container *ngIf="financeActivation === 'activated'">
  <div class="mb-3" *ngIf="!loadFailed">
    <h5>{{ accountName }}</h5>
    <p>
      <span>{{ accountType }}</span>
      <span> &middot; {{ "FINANCE_BALANCE_LABEL" | translate }}: {{ accountBalance }}</span>
    </p>
  </div>

  <app-white-card customClass="mb-3">
    <div class="row">
      <div class="col-md-6">
        <app-date-range-picker [formControl]="dateRangeControl"></app-date-range-picker>
      </div>
    </div>
  </app-white-card>

  <p *ngIf="loadFailed">{{ "FINANCE_FAILED_TO_LOAD_LEDGER_DETAIL" | translate }}</p>

  <p *ngIf="loading && !loadFailed">{{ "FINANCE_LOADING" | translate }}</p>

  <app-report-table
    *ngIf="!loadFailed"
    [columns]="columns"
    [rows]="rows"
    [paginated]="true"
    [componentName]="componentName"
    [currentPage]="currentPage"
    [totalRecords]="totalRecords"
    [rowsPerPage]="rowsPerPage"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  ></app-report-table>
</ng-container>
