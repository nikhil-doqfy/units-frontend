<app-finance-empty-state
  *ngIf="financeActivation !== 'activated'"
  [financeActivation]="financeActivation"
  title="Ledger Detail"
></app-finance-empty-state>

<ng-container *ngIf="financeActivation === 'activated'">
  <div class="mb-3" *ngIf="!loadFailed">
    <h5>{{ accountName }}</h5>
    <p>
      <span>{{ accountType }}</span>
      <span> &middot; Balance: {{ accountBalance }}</span>
    </p>
  </div>

  <div class="row mb-3">
    <div class="col-md-6">
      <app-date-range-picker [formControl]="dateRangeControl"></app-date-range-picker>
    </div>
  </div>

  <p *ngIf="loadFailed">Failed to load Ledger Detail.</p>

  <p *ngIf="loading && !loadFailed">Loading…</p>

  <app-report-table
    *ngIf="!loadFailed"
    [columns]="columns"
    [rows]="rows"
    [paginated]="true"
    [componentName]="componentName"
    [currentPage]="currentPage"
    [totalRecords]="totalRecords"
    [rowsPerPage]="rowsPerPage"
    (pageChange)="onPageChange($event)"
  ></app-report-table>
</ng-container>
