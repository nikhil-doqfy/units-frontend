<app-finance-empty-state
  *ngIf="financeActivation !== 'activated'"
  [financeActivation]="financeActivation"
  title="Balance Sheet"
></app-finance-empty-state>

<ng-container *ngIf="financeActivation === 'activated'">
  <div class="row mb-3">
    <div class="col-md-3">
      <app-as-of-date-picker [formControl]="asOfDateControl"></app-as-of-date-picker>
    </div>
  </div>

  <div class="alert alert-warning" role="alert" *ngIf="!balanced">
    Balance Sheet is not balanced for the selected date.
  </div>

  <p *ngIf="loadFailed">Failed to load Balance Sheet.</p>

  <p *ngIf="loading && !loadFailed">Loading…</p>

  <ng-container *ngIf="!loadFailed">
    <h5>Assets</h5>
    <app-report-table
      [columns]="columns"
      [rows]="assetRows"
    ></app-report-table>

    <h5 class="mt-4">Liabilities</h5>
    <app-report-table
      [columns]="columns"
      [rows]="liabilityRows"
    ></app-report-table>

    <div class="alert alert-info mt-3" role="alert">
      {{ equityName }}: {{ equityBalance }}
    </div>
  </ng-container>
</ng-container>
