<app-finance-empty-state
  *ngIf="financeActivation !== 'activated'"
  [financeActivation]="financeActivation"
  title="Ageing"
></app-finance-empty-state>

<ng-container *ngIf="financeActivation === 'activated'">
  <p *ngIf="loadFailed">Failed to load Ageing.</p>

  <p *ngIf="loading && !loadFailed">Loading…</p>

  <app-report-table
    *ngIf="!loadFailed"
    [columns]="columns"
    [rows]="rows"
    [paginated]="true"
    [componentName]="componentName"
    [currentPage]="currentPage"
    [totalRecords]="totalRecords"
    [rowsPerPage]="rowsPerPage"
    (pageChange)="onPageChange($event)"
  ></app-report-table>
</ng-container>
