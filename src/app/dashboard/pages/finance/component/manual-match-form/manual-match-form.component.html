<div class="manual-match-form">
  <h3>Manual Pairing</h3>

  <div class="form-group">
    <label for="manual-match-statement-line-id">Statement Line ID</label>
    <input
      id="manual-match-statement-line-id"
      type="number"
      min="1"
      step="1"
      class="form-control"
      [formControl]="statementLineIdControl"
      [disabled]="submitting"
    />
  </div>

  <div class="form-group">
    <label for="manual-match-journal-entry-id">Journal Entry ID</label>
    <input
      id="manual-match-journal-entry-id"
      type="number"
      min="1"
      step="1"
      class="form-control"
      [formControl]="journalEntryIdControl"
      [disabled]="submitting"
    />
  </div>

  <button
    type="button"
    class="btn btn-primary"
    [disabled]="!canSubmit"
    (click)="submit()"
  >
    {{ submitting ? 'Confirming…' : 'Confirm' }}
  </button>
</div>
