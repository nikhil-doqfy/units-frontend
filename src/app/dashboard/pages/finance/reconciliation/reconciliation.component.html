<app-finance-empty-state
  *ngIf="financeActivation !== 'activated'"
  [financeActivation]="financeActivation"
  title="Reconciliation"
></app-finance-empty-state>

<ng-container *ngIf="financeActivation === 'activated'">
  <app-bank-statement-upload
    [pmcId]="pmcId"
    (uploaded)="suggestedMatchesQueue.refreshQueue()"
  ></app-bank-statement-upload>
  <app-suggested-matches-queue
    #suggestedMatchesQueue
    [pmcId]="pmcId"
  ></app-suggested-matches-queue>
  <app-manual-match-form
    [pmcId]="pmcId"
    (paired)="suggestedMatchesQueue.refreshQueue()"
  ></app-manual-match-form>
</ng-container>
